plugins {
    id 'com.android.application'
}

// Keep Gradle build outputs under bin/Android/ alongside the other platforms.
layout.buildDirectory = file("../../../bin/Android/gradle-build/app")

android {
    namespace 'com.example.zipserve'
    compileSdk 35
    ndkVersion '29.0.14206865'

    // ANDROID_ABI=x86_64 (env or -Pandroid.abi) builds only the emulator ABI.
    // Unset → both ABIs, split into per-ABI APKs so native content is not
    // duplicated in one fat package.
    def abiProp = project.findProperty('android.abi') ?: System.getenv('ANDROID_ABI')
    def requestedAbis = (abiProp ? abiProp.toString() : 'arm64-v8a,x86_64')
            .split(',')
            .collect { it.trim() }
            .findAll { it }
    if (requestedAbis.isEmpty()) {
        requestedAbis = ['arm64-v8a', 'x86_64']
    }

    defaultConfig {
        // Read config file for applicationId and permissions
        def configFile = rootProject.file("../../src/config")
        def configMap = [:]
        if (configFile.exists()) {
            configFile.eachLine { line ->
                def parts = line.trim().split(/\s+/)
                if (parts.length >= 2) configMap[parts[0]] = parts[1]
            }
        }

        applicationId configMap.getOrDefault("BUNDLE_ID", "com.pulpgrinder.HeckinChonker")
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters.addAll(requestedAbis)
        }

        // Permission flags: use -P Gradle properties (set by mkandroid.sh)
        // with fallback to reading src/config directly (Android Studio).
        def perm = { String name ->
            def val = project.findProperty("PERM_${name.toUpperCase()}")
            if (val == null) val = configMap.get(name, 'false')
            return (val == 'true') ? 'true' : 'false'
        }
        buildConfigField "boolean", "PERM_LOCATION",    perm('uselocation')
        buildConfigField "boolean", "PERM_CAMERA",       perm('usecamera')
        buildConfigField "boolean", "PERM_MICROPHONE",   perm('usemicrophone')
        buildConfigField "boolean", "PERM_REMOTEDEBUGGING",   perm('allowremotedebugging')
    }

    splits {
        abi {
            enable requestedAbis.size() > 1
            reset()
            requestedAbis.each { include it }
            universalApk false
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Set environment variables to sign release builds:
        //   RELEASE_KEYSTORE, RELEASE_KEYSTORE_PASSWORD,
        //   RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
        def ksFile = System.getenv("RELEASE_KEYSTORE")
        def ksPass = System.getenv("RELEASE_KEYSTORE_PASSWORD")
        def ksAlias = System.getenv("RELEASE_KEY_ALIAS")
        def ksKeyPass = System.getenv("RELEASE_KEY_PASSWORD")
        if (ksFile && ksPass && ksAlias && ksKeyPass) {
            release {
                storeFile     file(ksFile)
                storePassword ksPass
                keyAlias      ksAlias
                keyPassword   ksKeyPass
            }
        } else {
            logger.warn("WARNING: No release signing config. Set RELEASE_KEYSTORE env vars for a distributable build.")
        }
    }

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
        }
    }

    buildTypes {
        debug {
            ndk { debugSymbolLevel 'none' }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'none' }
            if (signingConfigs.hasProperty('release')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}
